<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韭圈儿抄底指数 · 沪深300全收益 vs 万得偏债混合</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2329;
    --muted: #8a919f;
    --red: #e44d3e;
    --blue: #2f6fed;
    --border: #e8eaef;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    padding: 24px 16px 40px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .header { margin-bottom: 16px; }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header .sub { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.6; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
  }
  .stat .name { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .stat .name .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .stat .num { font-size: 26px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .stat .extra { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px 8px;
  }
  .card-title { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .card-title b { color: var(--text); }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .seg button { border: none; background: #fff; padding: 3px 12px; font-size: 12px; cursor: pointer; color: var(--text); }
  .seg button.active { background: #eef3ff; color: var(--blue); }
  #chart { width: 100%; height: 520px; }
  .legend-inline { display: flex; gap: 18px; font-size: 12px; color: var(--muted); padding: 6px 4px 10px; flex-wrap: wrap; }
  .legend-inline b { color: var(--text); font-weight: 600; }

  .footer { color: var(--muted); font-size: 12px; margin-top: 14px; line-height: 1.8; }
  .footer a { color: var(--blue); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>韭圈儿抄底指数</h1>
    <div class="sub">沪深300全收益指数 vs 万得偏债混合型基金指数 · 成立以来 · 收益率</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="name"><span class="dot" style="background:var(--red)"></span>沪深300全收益指数 (H00300)</div>
      <div class="num" id="stat-hs300">--</div>
      <div class="extra" id="stat-hs300-dd">--</div>
    </div>
    <div class="stat">
      <div class="name"><span class="dot" style="background:var(--blue)"></span>万得偏债混合型基金指数 (885003.WI)</div>
      <div class="num" id="stat-pz">--</div>
      <div class="extra" id="stat-pz-dd">--</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title" style="display:flex;align-items:center;gap:10px">
      <span>自成立以来收益率走势 <span id="range-label"></span></span>
      <span style="flex:1"></span>
      <span class="seg">
        <button data-mode="norm">收益率</button>
        <button data-mode="pt" class="active">点位</button>
      </span>
    </div>
    <div id="chart"></div>
    <div class="legend-inline">
      <span><b id="lh-name">沪深300全收益</b> <span id="lh-val">--</span></span>
      <span><b id="lp-name">万得偏债混合</b> <span id="lp-val">--</span></span>
    </div>
  </div>

  <div class="footer">
    数据来源: 沪深300全收益指数(H00300) 来自 <a href="https://www.csindex.com.cn/zh-CN/indices/index-detail/H00300">中证指数公司官网</a> (日线); 万得偏债混合型基金指数(885003.WI) 来自 <a href="https://www.windindices.com/">万得指数官网</a> 免费接口 (近1年日线)。<br>
    本页面仅作研究展示, 不构成投资建议。
    <span id="update-time"></span>
  </div>
</div>

<script>
const SERIES = [
  { key: "h00300", name: "沪深300全收益", color: "#e44d3e" },
  { key: "885003", name: "万得偏债混合",   color: "#2f6fed" },
];

let chart, raw = {}, mode = "pt";

function fmtPct(x) { return (x >= 0 ? "+" : "") + x.toFixed(2) + "%"; }

function maxDrawdown(points) {
  let peak = -Infinity, mdd = 0;
  for (const p of points) {
    peak = Math.max(peak, p.close);
    mdd = Math.min(mdd, p.close / peak - 1);
  }
  return mdd * 100;
}

function render() {
  const prepared = SERIES.map(s => {
    const data = raw[s.key];
    return { ...s, data, base: data.length ? data[0].close : null };
  });

  for (const s of prepared) {
    const last = s.data.at(-1);
    const numEl = document.getElementById(s.key === "h00300" ? "stat-hs300" : "stat-pz");
    const ddEl = document.getElementById(s.key === "h00300" ? "stat-hs300-dd" : "stat-pz-dd");
    if (!last) {
      numEl.textContent = "--";
      ddEl.textContent = "暂无数据";
      continue;
    }
    const ret = (last.close / s.base - 1) * 100;
    const mdd = maxDrawdown(s.data).toFixed(2);
    const start = s.data[0].date;
    if (mode === "norm") {
      numEl.textContent = fmtPct(ret);
      ddEl.textContent = `自${start} · 当前点位 ${last.close.toFixed(2)} · 最大回撤 ${mdd}%`;
    } else {
      numEl.textContent = last.close.toFixed(2);
      ddEl.textContent = `自${start} ${fmtPct(ret)} · 最大回撤 ${mdd}%`;
    }
  }

  const dates = [...new Set(prepared.flatMap(s => s.data.map(d => d.date)))].sort();
  const maps = prepared.map(s => new Map(s.data.map(d => [d.date, d])));
  const seriesData = prepared.map((s, si) => ({
    name: s.name,
    type: "line",
    smooth: true,
    symbol: "none",
    data: dates.map(d => {
      const hit = maps[si].get(d);
      if (!hit) return null;
      const v = mode === "norm"
        ? +((hit.close / s.base - 1) * 100).toFixed(2)
        : +hit.close.toFixed(2);
      return [d, v];
    }),
    lineStyle: { width: 2.2, color: s.color },
    itemStyle: { color: s.color },
    areaStyle: {
      opacity: 0.08,
      color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
        { offset: 0, color: s.color + "55" },
        { offset: 1, color: s.color + "00" },
      ]),
    },
    connectNulls: false,
    z: 2,
  }));

  document.getElementById("range-label").textContent =
    `(${dates[0]} ~ ${dates.at(-1)})`;

  for (const s of prepared) {
    const lv = s.data.at(-1);
    const el = document.getElementById(s.key === "h00300" ? "lh-val" : "lp-val");
    if (!lv) { el.textContent = "--"; continue; }
    const ret = (lv.close / s.base - 1) * 100;
    el.textContent = mode === "norm" ? fmtPct(ret) + " (" + dates.at(-1) + ")" : lv.close.toFixed(2) + " (" + dates.at(-1) + ")";
  }

  chart.setOption({
    animation: false,
    grid: { left: 64, right: 20, top: 20, bottom: 50 },
    tooltip: {
      trigger: "axis",
      backgroundColor: "rgba(31,35,41,0.92)",
      borderWidth: 0,
      textStyle: { color: "#fff", fontSize: 12 },
      axisPointer: { type: "cross", label: { backgroundColor: "#555" } },
      formatter(params) {
        const p = params[0];
        if (!p) return "";
        let html = `<div style="font-weight:600;margin-bottom:4px">${p.axisValue}</div>`;
        for (const s of prepared) {
          const hit = s.data.find(d => d.date === p.axisValue);
          if (!hit) continue;
          const col = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:6px"></span>`;
          const ret = (hit.close / s.base - 1) * 100;
          if (mode === "norm") {
            html += `<div style="display:flex;justify-content:space-between;gap:24px">${col}${s.name}<span>${fmtPct(ret)}</span></div>`;
          } else {
            html += `<div style="display:flex;justify-content:space-between;gap:24px">${col}${s.name}<span>${hit.close.toFixed(2)} <span style="color:#9aa2b0">(${fmtPct(ret)})</span></span></div>`;
          }
        }
        return html;
      },
    },
    legend: { show: false },
    xAxis: {
      type: "category",
      data: dates,
      boundaryGap: false,
      axisLine: { lineStyle: { color: "#dcdcdc" } },
      axisLabel: { color: "#8a919f" },
    },
    yAxis: {
      type: "value",
      scale: true,
      axisLabel: { color: "#8a919f", formatter: v => (mode === "norm" ? v + "%" : v) },
      splitLine: { lineStyle: { color: "#f0f1f4" } },
    },
    dataZoom: [
      { type: "inside", start: 0, end: 100 },
      {
        type: "slider", height: 18, bottom: 8,
        borderColor: "#e8eaef", backgroundColor: "#f7f8fa",
        fillerColor: "rgba(47,111,237,0.12)",
        handleStyle: { color: "#fff", borderColor: "#2f6fed" },
        textStyle: { color: "#8a919f" },
      },
    ],
    series: seriesData,
  });
}

async function init() {
  const [h, w] = await Promise.all([
    fetch("./data/h00300.json").then(r => r.json()),
    fetch("./data/885003.json").then(r => r.json()),
  ]);
  raw.h00300 = h;
  raw["885003"] = w;
  chart = echarts.init(document.getElementById("chart"));
  render();
  window.addEventListener("resize", () => chart && chart.resize());
  document.getElementById("update-time").textContent =
    " · 数据更新至 " + (raw.h00300.at(-1) ? raw.h00300.at(-1).date : "");
}

document.querySelectorAll(".seg button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".seg button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    mode = b.dataset.mode;
    render();
  });
});

init();
</script>
</body>
</html>
